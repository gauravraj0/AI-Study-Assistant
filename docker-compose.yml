version: "3.9"

# Full stack: PostgreSQL + FastAPI + React (dev mode).
# Bring up with:  docker compose up --build
# Point the backend at Postgres via DATABASE_URL (set in .env or below).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: study
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://study:study@db:5432/study
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SEED_DEMO: "true"
      # Optional: set to enable a real LLM instead of the local engine
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
